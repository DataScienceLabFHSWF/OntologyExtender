name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Optional env control for embedding model pull in CI (disabled by default)
    env:
      HITL_SEMANTIC_EMBEDDING_MODEL: qwen3-embedding
      HITL_PULL_OLLAMA_EMBED: 'false'
      HITL_RUN_SLOW_TESTS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Optionally pull Ollama embedding model
        if: env.HITL_PULL_OLLAMA_EMBED == 'true'
        run: |
          echo "Requested pull for embedding model: $HITL_SEMANTIC_EMBEDDING_MODEL"
          if command -v ollama >/dev/null 2>&1; then
            ollama pull "$HITL_SEMANTIC_EMBEDDING_MODEL" || true
          else
            echo "ollama CLI not available in runner — skipping pull"
          fi

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run tests (fast — exclude slow)
        run: |
          pytest tests/ -v --tb=short --cov=src/ontology_hitl --cov-report=xml -m "not slow"

      - name: Run slow tests (optional)
        if: env.HITL_RUN_SLOW_TESTS == 'true'
        run: |
          echo "Running slow tests as requested"
          pytest tests/ -v -m slow

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        if: matrix.python-version == '3.10'
