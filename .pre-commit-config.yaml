repos:
  # Code formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-all
        files: ^src/

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements

  # Markdown linting
  - repo: https://github.com/mdformat/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        args: [--number, --no-wrap]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables

  # Documentation
  - repo: local
    hooks:
      - id: sphinx-docs-build
        name: Sphinx documentation build check
        entry: bash -c 'cd docs && make clean && make html > /dev/null 2>&1'
        language: system
        files: ^(docs/|src/ontology_hitl/.*\.py)$
        pass_filenames: false
        stages: [commit]
