[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-hitl"
version = "0.1.0"
description = "Human-in-the-Loop Ontology Extension for Knowledge Graph Construction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["ontology", "knowledge-graph", "hitl", "shacl", "owl"]

dependencies = [
    # RDF / Ontology
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "owlready2>=0.46",

    # Data models & config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # LLM access
    "httpx>=0.27",

    # Vector store (shared with KGB)
    "qdrant-client>=1.9",

    # CLI
    "typer>=0.12",
    "rich>=13.0",

    # Logging
    "structlog>=24.0",

    # YARRRML / RML mapping
    "pyyaml>=6.0",
    "morph-kgc>=2.8",

    # Experiment tracking
    "wandb>=0.18",
    "langchain>=1.0",
    "langsmith>=0.7",

    # Benchmarking (OntoURL)
    "datasets>=3.0",
    "rouge-score>=0.1",
    "nltk>=3.8",

    # Web dashboard
    "streamlit>=1.28",

    # Utilities
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Optional benchmarking / plotting (not required for CI core path)
    "sentence-transformers>=2.2",
    "matplotlib>=3.7",
    "pandas>=2.0",
]
all = ["ontology-hitl[web,dev]"]

[project.scripts]
hitl-review = "ontology_hitl.review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_hitl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore:.*setParseAction.*:DeprecationWarning",
  "ignore:.*leaveWhitespace.*:DeprecationWarning",
  "ignore:.*setName.*:DeprecationWarning",
  "ignore:.*addParseAction.*:DeprecationWarning",
  "ignore:.*delimitedList.*:DeprecationWarning",
  "ignore:.*parseString.*:DeprecationWarning",
  "ignore::pyparsing.util.PyparsingDeprecationWarning",
  "ignore:cannot collect test class 'TestCase' because it has a __init__ constructor:pytest.PytestCollectionWarning",
  "ignore:Can't initialize NVML:UserWarning",
]
